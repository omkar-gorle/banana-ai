services:
  db:
    image: postgres:18-alpine
    container_name: banana-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banana_ai
      POSTGRES_USER: banana_user
      POSTGRES_PASSWORD: banana_password
    ports:
      - "5432:5432"
    volumes:
      - banana_pgdata:/var/lib/postgresql

volumes:
  banana_pgdata:
